name: Windows desktop installer

on:
  push:
    branches: [main, codex/windows-wrapper-installer]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:edc
      - run: npm run desktop:windows:build
      - run: npm run desktop:windows:dist
      - name: Launch portable app and verify renderer controls
        shell: pwsh
        run: |
          $app = Get-ChildItem release/windows/*-Portable.exe | Select-Object -First 1
          if (-not $app) { throw "Portable executable was not produced" }
          $process = Start-Process -FilePath $app.FullName -ArgumentList "--smoke-test" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Quiver desktop smoke test failed with exit code $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: quiver-windows-installer
          path: release/windows/*
          if-no-files-found: error
          retention-days: 14
